version: '3.8'

services:
  site1:
    image: nginx:alpine
    container_name: site1
    volumes:
      - ./site1:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - webnet

  site2:
    image: nginx:alpine
    container_name: site2
    volumes:
      - ./site2:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - webnet

  site3:
    build: ./site3
    container_name: site3
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - webnet
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - webnet
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  webnet:
    driver: bridge
