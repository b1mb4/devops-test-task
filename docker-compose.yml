version: '3.8'

services:
  site1:
    image: nginx:alpine
    container_name: site1
    volumes:
      - ./site1:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - webnet

  site2:
    image: nginx:alpine
    container_name: site2
    volumes:
      - ./site2:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - webnet

  site3:
    build: ./site3
    container_name: site3
    restart: unless-stopped
    networks:
      - webnet

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site1
      - site2
      - site3
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
