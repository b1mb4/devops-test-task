server {
    listen 80;

    server_name _;

    location /site1/ {
        proxy_pass http://site1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /site2/ {
        proxy_pass http://site2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /site3/ {
        proxy_pass http://site3:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 200 "Multi-site proxy up. Try /site1/, /site2/ or /site3/\n";
        add_header Content-Type text/plain;
    }   
}